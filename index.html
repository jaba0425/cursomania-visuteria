<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cursomania – Videos de cursos de bisutería organizados por categoría.">
  <title>Cursomania – Bisutería</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231A6FD4'/><text y='72' x='50' text-anchor='middle' font-size='58' font-family='Arial' font-weight='900' fill='%23F5A623'>C</text></svg>">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
      cursor: pointer;
    }
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: #6e6e73;
    }
    .breadcrumb button {
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      color: #0066cc;
      padding: 0;
    }
    .breadcrumb button:hover { text-decoration: underline; }

    /* ── Main ── */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }
    .page-title {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.8px;
      line-height: 1.1;
    }
    .page-subtitle {
      margin-top: 8px;
      margin-bottom: 40px;
      font-size: 17px;
      color: #6e6e73;
    }

    /* ── Category grid ── */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }
    .cat-card {
      background: #fff;
      border-radius: 18px;
      padding: 28px 22px;
      cursor: pointer;
      border: 1px solid rgba(0,0,0,0.05);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      display: flex;
      flex-direction: column;
      gap: 12px;
      user-select: none;
    }
    .cat-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(0,0,0,0.12);
    }
    .cat-card:active { transform: scale(0.97); }
    .cat-icon { font-size: 38px; line-height: 1; }
    .cat-name { font-size: 16px; font-weight: 600; letter-spacing: -0.2px; }
    .cat-arrow { font-size: 13px; color: #6e6e73; }

    /* ── Back button ── */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
      color: #0066cc;
      padding: 0;
      margin-bottom: 28px;
    }
    .back-btn:hover { text-decoration: underline; }

    /* ── Video grid ── */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 20px;
    }
    .vid-card {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid rgba(0,0,0,0.05);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      user-select: none;
    }
    .vid-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(0,0,0,0.12);
    }
    .vid-thumb {
      width: 100%;
      aspect-ratio: 16/9;
      background: #e5e5ea;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }
    .vid-thumb img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.18s;
    }
    .vid-card:hover .play-overlay { opacity: 1; }
    .play-circle {
      width: 54px;
      height: 54px;
      background: rgba(255,255,255,0.95);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .play-circle svg { width: 22px; height: 22px; margin-left: 3px; }
    .vid-info { padding: 14px 16px; }
    .vid-name {
      font-size: 14px;
      font-weight: 500;
      color: #1d1d1f;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
    }

    /* ── Modal ── */
    .modal-bg {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 56px 24px 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .modal-bg.open {
      opacity: 1;
      pointer-events: all;
    }
    .modal-toolbar {
      width: 100%;
      max-width: 960px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      flex-shrink: 0;
    }
    .modal-title {
      font-size: 14px;
      color: rgba(255,255,255,0.75);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: calc(100% - 100px);
    }
    .modal-close {
      flex-shrink: 0;
      background: rgba(255,255,255,0.15);
      border: none;
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      padding: 6px 14px;
      border-radius: 20px;
      transition: background 0.15s;
    }
    .modal-close:hover { background: rgba(255,255,255,0.25); }
    .modal-player {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      transform: scale(0.96);
      transition: transform 0.25s ease;
    }
    .modal-bg.open .modal-player { transform: scale(1); }
    .modal-player iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* ── Loading / states ── */
    .state-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 100px 0;
      gap: 16px;
      color: #6e6e73;
      font-size: 16px;
      text-align: center;
    }
    .spinner {
      width: 30px;
      height: 30px;
      border: 2px solid #d2d2d7;
      border-top-color: #1d1d1f;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .page-title { font-size: 28px; }
      .category-grid { grid-template-columns: repeat(2, 1fr); }
      .video-grid { grid-template-columns: 1fr; }
      .modal-bg { padding: 16px; justify-content: flex-end; }
      .modal-player { border-radius: 10px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <span class="logo" id="logo">
      <svg height="32" viewBox="0 0 220 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Cursomania">
        <text y="26" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">
          <tspan fill="#1A6FD4">Curso</tspan><tspan fill="#F5A623">mania</tspan>
        </text>
      </svg>
    </span>
    <div class="breadcrumb" id="breadcrumb"></div>
  </div>
</header>

<main id="main"></main>

<div class="modal-bg" id="modal">
  <div class="modal-toolbar">
    <span class="modal-title" id="modal-title"></span>
    <button class="modal-close" id="modal-close-btn">✕ Cerrar</button>
  </div>
  <div class="modal-player">
    <iframe id="modal-iframe"
      allow="autoplay; fullscreen; encrypted-media"
      allowfullscreen>
    </iframe>
  </div>
</div>

<script>
const API_KEY     = 'AIzaSyDQr4efF4RuysRJPZPb_A1MF-CFHNIkaTw';
const ROOT_ID     = '12Y0aAfWoEiRxpdeSXryG9eJp9t7cCUlt';
const DRIVE_FILES = 'https://www.googleapis.com/drive/v3/files';

const ICONS = {
  'COLLARES':       '📿',
  'PULSERAS':       '✨',
  'LLAVEROS':       '🔑',
  'RELIGIOSOS':     '🕊️',
  'PORCELANA':      '🫙',
  'MACRAME':        '🧶',
  'MACRАМÉ':        '🧶',
  'ARETES':         '💎',
  'TOBILLERAS':     '🌸',
  'DE TODO':        '🎨',
  'ANILLOS':        '💍',
  'NAVIDAD':        '🎄',
  'ATRAPASUENOS':   '🌙',
  'ATRAPASUEÑOS':   '🌙',
  'PORCELANA FRIA': '🌺',
  'PORCELANA FRÍA': '🌺',
  'CARTUCHERAS':    '🎒',
  'TRUCOS':         '💡',
};

// Strips "1. " prefix and returns uppercase key for icon lookup
function folderKey(name) {
  return name.replace(/^\d+\.\s*/, '').toUpperCase().trim();
}

// Converts "1. COLLARES" → "Collares" for display
function folderDisplay(name) {
  const clean = name.replace(/^\d+\.\s*/, '').trim();
  return clean.charAt(0).toUpperCase() + clean.slice(1).toLowerCase();
}

// ── API ─────────────────────────────────────────────────────────────────────

async function driveList(q, fields) {
  let files = [];
  let pageToken = null;

  do {
    const url = new URL(DRIVE_FILES);
    const params = { q, fields: `nextPageToken,${fields}`, key: API_KEY, pageSize: 1000 };
    if (pageToken) params.pageToken = pageToken;
    Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));

    const res = await fetch(url);
    const json = await res.json();
    if (!res.ok || json.error) throw new Error(json.error?.message ?? `Drive API ${res.status}`);

    files = files.concat(json.files || []);
    pageToken = json.nextPageToken || null;
  } while (pageToken);

  return files;
}

async function countVideos(folderId) {
  try {
    const files = await driveList(
      `'${folderId}' in parents and not mimeType='application/vnd.google-apps.folder' and trashed=false`,
      'files(id)'
    );
    return files.length;
  } catch {
    return 0;
  }
}

// ── Render helpers ───────────────────────────────────────────────────────────

function setMain(html) {
  document.getElementById('main').innerHTML = html;
}

function showLoading(msg) {
  setMain(`<div class="state-block"><div class="spinner"></div><span>${msg}</span></div>`);
}

function setBreadcrumb(categoryName) {
  document.getElementById('breadcrumb').innerHTML = categoryName
    ? `<button id="bc-home">Inicio</button><span>›</span><span>${esc(categoryName)}</span>`
    : '';
  if (categoryName) {
    document.getElementById('bc-home').addEventListener('click', showCategories);
  }
}

// ── Views ────────────────────────────────────────────────────────────────────

async function showCategories() {
  showLoading('Cargando categorías…');
  setBreadcrumb(null);
  document.title = 'Cursomania – Bisutería';

  let folders;
  try {
    folders = await driveList(
      `'${ROOT_ID}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`,
      'files(id,name)'
    );
  } catch (e) {
    setMain(`<div class="state-block">⚠️ Error al conectar con Drive.<br><small>${esc(e.message)}</small></div>`);
    return;
  }

  if (!folders.length) {
    setMain(`<div class="state-block">No se encontraron categorías.</div>`);
    return;
  }

  // Contar videos en paralelo y ordenar de mayor a menor
  const counts = await Promise.all(folders.map(f => countVideos(f.id)));
  const sorted = folders
    .map((f, i) => ({ ...f, count: counts[i] }))
    .sort((a, b) => b.count - a.count);

  const grid = document.createElement('div');
  grid.className = 'category-grid';

  sorted.forEach(f => {
    const card = document.createElement('div');
    card.className = 'cat-card';
    card.dataset.id   = f.id;
    card.dataset.name = f.name;
    const display = folderDisplay(f.name);
    card.innerHTML = `
      <span class="cat-icon">${ICONS[folderKey(f.name)] ?? '📁'}</span>
      <span class="cat-name">${esc(display)}</span>
      <span class="cat-arrow">${f.count} video${f.count !== 1 ? 's' : ''}</span>
    `;
    grid.appendChild(card);
  });

  grid.addEventListener('click', e => {
    const card = e.target.closest('.cat-card');
    if (card) showVideos(card.dataset.id, card.dataset.name);
  });

  const container = document.getElementById('main');
  container.innerHTML = `
    <h1 class="page-title">Cursomania</h1>
    <p class="page-subtitle">Selecciona una categoría</p>
  `;
  container.appendChild(grid);
}

async function showVideos(folderId, folderName) {
  showLoading('Cargando videos…');
  const displayName = folderDisplay(folderName);
  setBreadcrumb(displayName);
  document.title = `${displayName} – Cursomania`;

  let videos;
  try {
    videos = await driveList(
      `'${folderId}' in parents and not mimeType='application/vnd.google-apps.folder' and trashed=false`,
      'files(id,name,thumbnailLink)'
    );
  } catch (e) {
    const container = document.getElementById('main');
    container.innerHTML = '';
    const backBtn = document.createElement('button');
    backBtn.className = 'back-btn';
    backBtn.textContent = '← Categorías';
    backBtn.addEventListener('click', showCategories);
    container.appendChild(backBtn);
    container.insertAdjacentHTML('beforeend',
      `<div class="state-block">⚠️ Error al cargar videos.<br><small>${esc(e.message)}</small></div>`);
    return;
  }

  const container = document.getElementById('main');
  const count     = videos.length;

  const backBtn = document.createElement('button');
  backBtn.className = 'back-btn';
  backBtn.textContent = '← Categorías';
  backBtn.addEventListener('click', showCategories);

  container.innerHTML = '';
  container.appendChild(backBtn);
  container.insertAdjacentHTML('beforeend', `
    <h1 class="page-title">${esc(displayName)}</h1>
    <p class="page-subtitle">${count} ${count === 1 ? 'video' : 'videos'}</p>
  `);

  if (!count) {
    container.insertAdjacentHTML('beforeend',
      `<div class="state-block">No hay videos en esta categoría.</div>`);
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'video-grid';

  videos.forEach(v => {
    const vidName = v.name.replace(/\.[^.]+$/, '');
    const card = document.createElement('div');
    card.className = 'vid-card';
    card.dataset.id   = v.id;
    card.dataset.name = vidName;
    card.innerHTML = `
      <div class="vid-thumb">
        ${v.thumbnailLink ? `<img src="${esc(v.thumbnailLink)}" alt="" loading="lazy" onerror="this.remove()">` : '🎬'}
        <div class="play-overlay">
          <div class="play-circle">
            <svg viewBox="0 0 24 24" fill="#1d1d1f"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>
      </div>
      <div class="vid-info">
        <p class="vid-name">${esc(vidName)}</p>
      </div>
    `;
    grid.appendChild(card);
  });

  grid.addEventListener('click', e => {
    const card = e.target.closest('.vid-card');
    if (card) openVideo(card.dataset.id, card.dataset.name);
  });

  container.appendChild(grid);
}

// ── Modal ────────────────────────────────────────────────────────────────────

function openVideo(fileId, name) {
  const modal  = document.getElementById('modal');
  const iframe = document.getElementById('modal-iframe');
  document.getElementById('modal-title').textContent = name;
  iframe.src = `https://drive.google.com/file/d/${fileId}/preview?rm=minimal`;
  modal.classList.add('open');
}

function closeModal() {
  const modal  = document.getElementById('modal');
  const iframe = document.getElementById('modal-iframe');
  modal.classList.remove('open');
  setTimeout(() => { iframe.src = ''; }, 280);
}

document.getElementById('modal-close-btn').addEventListener('click', closeModal);

document.getElementById('modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// ── Utils ─────────────────────────────────────────────────────────────────────

function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ── Boot ─────────────────────────────────────────────────────────────────────

document.getElementById('logo').addEventListener('click', showCategories);
showCategories();
</script>
</body>
</html>
