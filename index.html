<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="El lucrativo negocio de las manualidades – Videos de cursos de bisutería organizados por categoría.">
  <title>El lucrativo negocio de las manualidades</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231A6FD4'/><text y='72' x='50' text-anchor='middle' font-size='58' font-family='Arial' font-weight='900' fill='%23F5A623'>C</text></svg>">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      height: 88px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    #logo { cursor: pointer; display: block; flex-shrink: 0; }

    /* ── Search bar ── */
    .search-wrap {
      flex: 1;
      max-width: 420px;
      position: relative;
    }
    .search-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px; height: 16px;
      color: #6e6e73;
      pointer-events: none;
    }
    #search-input {
      width: 100%;
      padding: 9px 12px 9px 36px;
      border: 1px solid rgba(0,0,0,0.12);
      border-radius: 10px;
      background: rgba(0,0,0,0.05);
      font-family: inherit;
      font-size: 14px;
      color: #1d1d1f;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    #search-input:focus {
      border-color: #0066cc;
      background: #fff;
    }
    #search-input::placeholder { color: #8e8e93; }

    /* ── Nav link Aprende ── */
    .nav-learn {
      flex-shrink: 0;
      background: none;
      border: 1.5px solid rgba(0,0,0,0.12);
      border-radius: 20px;
      padding: 7px 16px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: #1d1d1f;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .nav-learn:hover { background: #f0f0f5; border-color: rgba(0,0,0,0.2); }
    .nav-learn.active { background: #1d1d1f; color: #fff; border-color: #1d1d1f; }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: #6e6e73;
      flex-shrink: 0;
      margin-left: auto;
    }
    .breadcrumb button {
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      color: #0066cc;
      padding: 0;
    }
    .breadcrumb button:hover { text-decoration: underline; }

    /* ── Main ── */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }
    .page-title {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.8px;
      line-height: 1.1;
    }
    .page-subtitle {
      margin-top: 8px;
      margin-bottom: 40px;
      font-size: 17px;
      color: #6e6e73;
    }

    /* ── Category grid ── */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }
    .cat-card {
      background: #fff;
      border-radius: 18px;
      padding: 28px 22px;
      cursor: pointer;
      border: 1px solid rgba(0,0,0,0.05);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      display: flex;
      flex-direction: column;
      gap: 12px;
      user-select: none;
    }
    .cat-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(0,0,0,0.12);
    }
    .cat-card:active { transform: scale(0.97); }
    .cat-icon { font-size: 38px; line-height: 1; }
    .cat-name { font-size: 16px; font-weight: 600; letter-spacing: -0.2px; }
    .cat-count { font-size: 13px; color: #6e6e73; }

    /* Favoritos card accent */
    .cat-card.fav-cat {
      background: linear-gradient(135deg, #fff0f3, #fff);
      border-color: rgba(255,59,89,0.15);
    }
    .cat-card.fav-cat .cat-name { color: #c41230; }

    /* ── Back button ── */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
      color: #0066cc;
      padding: 0;
      margin-bottom: 28px;
    }
    .back-btn:hover { text-decoration: underline; }

    /* ── Video grid ── */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 20px;
    }
    .vid-card {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid rgba(0,0,0,0.05);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      user-select: none;
      position: relative;
    }
    .vid-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(0,0,0,0.12);
    }
    .vid-thumb {
      width: 100%;
      aspect-ratio: 16/9;
      background: #e5e5ea;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }
    .vid-thumb img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.18s;
    }
    .vid-card:hover .play-overlay { opacity: 1; }
    .play-circle {
      width: 54px;
      height: 54px;
      background: rgba(255,255,255,0.95);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .play-circle svg { width: 22px; height: 22px; margin-left: 3px; }

    /* Progress bar on thumbnail */
    .vid-watched-bar {
      position: absolute;
      bottom: 0; left: 0;
      height: 3px;
      background: #ff3b5a;
      border-radius: 0 2px 0 0;
      pointer-events: none;
      z-index: 2;
    }

    /* Favorite button */
    .fav-btn {
      position: absolute;
      top: 8px; right: 8px;
      z-index: 3;
      background: rgba(0,0,0,0.45);
      border: none;
      border-radius: 50%;
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      transition: background 0.15s, transform 0.15s;
      backdrop-filter: blur(4px);
    }
    .fav-btn:hover { background: rgba(0,0,0,0.65); transform: scale(1.12); }
    .fav-btn.active { background: rgba(255,59,89,0.85); }

    .vid-info { padding: 12px 16px 14px; }
    .vid-name {
      font-size: 14px;
      font-weight: 500;
      color: #1d1d1f;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
    }
    .vid-resume {
      margin-top: 5px;
      font-size: 12px;
      color: #ff3b5a;
      font-weight: 500;
    }
    .vid-cat-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 8px;
      background: #f0f0f5;
      border-radius: 6px;
      font-size: 11px;
      color: #6e6e73;
      font-weight: 500;
    }

    /* ── Modal ── */
    .modal-bg {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 56px 24px 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .modal-bg.open { opacity: 1; pointer-events: all; }
    .modal-toolbar {
      width: 100%;
      max-width: 960px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      flex-shrink: 0;
    }
    .modal-title {
      font-size: 14px;
      color: rgba(255,255,255,0.75);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: calc(100% - 100px);
    }
    .modal-close {
      flex-shrink: 0;
      background: rgba(255,255,255,0.15);
      border: none;
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      padding: 6px 14px;
      border-radius: 20px;
      transition: background 0.15s;
    }
    .modal-close:hover { background: rgba(255,255,255,0.25); }
    .modal-player {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      transform: scale(0.96);
      transition: transform 0.25s ease;
      position: relative;
    }
    .modal-bg.open .modal-player { transform: scale(1); }

    /* ── YouTube custom controls ── */
    #yt-frame { width: 100%; height: 100%; }
    #yt-frame iframe { width: 100% !important; height: 100% !important; border: none; }

    .yt-click-blocker {
      position: absolute;
      inset: 0;
      z-index: 5;
      background: transparent;
      transition: background 0.15s;
    }
    .yt-click-blocker::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 72px;
      background: #000;
      border-radius: 14px 14px 0 0;
    }
    .yt-click-blocker::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 60px;
      background: #000;
      border-radius: 0 0 14px 14px;
    }

    .yt-controls {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 52px;
      background: rgba(0,0,0,0.75);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      border-radius: 0 0 14px 14px;
      z-index: 10;
    }
    .yt-play-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      opacity: 0.9;
      transition: opacity 0.15s;
    }
    .yt-play-btn:hover { opacity: 1; }
    .yt-play-btn svg { width: 22px; height: 22px; }
    .yt-progress-wrap {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.3);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }
    .yt-progress-wrap:hover { height: 6px; }
    .yt-progress-fill {
      height: 100%;
      background: #fff;
      border-radius: 2px;
      width: 0%;
      pointer-events: none;
      transition: width 0.1s linear;
    }
    .yt-time {
      font-size: 12px;
      color: rgba(255,255,255,0.85);
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* ── States ── */
    .state-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 100px 0;
      gap: 16px;
      color: #6e6e73;
      font-size: 16px;
      text-align: center;
    }
    .spinner {
      width: 30px; height: 30px;
      border: 2px solid #d2d2d7;
      border-top-color: #1d1d1f;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Fullscreen button */
    .yt-fs-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      opacity: 0.9;
      transition: opacity 0.15s;
    }
    .yt-fs-btn:hover { opacity: 1; }
    .yt-fs-btn svg { width: 20px; height: 20px; }

    /* ── Sección Aprende ── */
    .learn-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }
    .learn-card {
      border-radius: 20px;
      padding: 32px 28px;
      cursor: pointer;
      border: 1px solid rgba(0,0,0,0.06);
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .learn-card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(0,0,0,0.12); }
    .learn-card-emoji { font-size: 44px; line-height: 1; }
    .learn-card-tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
    .learn-card-title { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; line-height: 1.25; }
    .learn-card-desc { font-size: 14px; color: #6e6e73; line-height: 1.5; }
    .learn-card-meta { font-size: 12px; color: #8e8e93; margin-top: 4px; }

    /* ── Article reader ── */
    .article-body {
      max-width: 700px;
      margin: 0 auto;
      font-size: 17px;
      line-height: 1.75;
      color: #1d1d1f;
    }
    .article-hero {
      border-radius: 20px;
      padding: 40px 36px;
      margin-bottom: 40px;
    }
    .article-hero-tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .article-hero-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.6px;
      line-height: 1.15;
      margin-bottom: 12px;
    }
    .article-hero-sub { font-size: 16px; opacity: 0.75; line-height: 1.5; }
    .article-hero-meta { font-size: 13px; opacity: 0.55; margin-top: 20px; }

    .article-intro {
      font-size: 17px;
      color: #3a3a3c;
      line-height: 1.8;
      margin-bottom: 36px;
      padding-bottom: 36px;
      border-bottom: 1px solid #e5e5ea;
    }
    .article-section { margin-bottom: 36px; }
    .article-section-heading {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }
    .article-section-num {
      width: 34px; height: 34px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 800;
      flex-shrink: 0;
      color: #fff;
    }
    .article-section-title { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
    .article-text { margin-bottom: 16px; color: #3a3a3c; }

    /* Formula */
    .article-formula {
      background: #1d1d1f;
      color: #fff;
      border-radius: 16px;
      padding: 24px 28px;
      margin: 20px 0;
    }
    .article-formula-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #C9A84C;
      margin-bottom: 12px;
    }
    .article-formula-text { font-size: 18px; font-weight: 600; line-height: 1.5; }
    .article-formula-note { font-size: 14px; color: rgba(255,255,255,0.65); margin-top: 12px; line-height: 1.5; }

    /* Tip box */
    .article-tip {
      background: #FDF3DC;
      border-left: 4px solid #C9A84C;
      border-radius: 0 12px 12px 0;
      padding: 16px 20px;
      margin: 20px 0;
      font-size: 15px;
      color: #5a4a1a;
      line-height: 1.6;
    }
    .article-tip::before { content: '💡 '; font-style: normal; }

    /* Steps */
    .article-steps { margin: 16px 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .article-steps li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 15px;
      color: #3a3a3c;
    }
    .step-num {
      width: 26px; height: 26px;
      border-radius: 50%;
      background: #1d1d1f;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* Tables */
    .article-table-wrap { overflow-x: auto; margin: 16px 0; border-radius: 12px; border: 1px solid #e5e5ea; }
    .article-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .article-table th {
      background: #1d1d1f;
      color: #fff;
      padding: 12px 16px;
      text-align: left;
      font-weight: 600;
      font-size: 13px;
    }
    .article-table th:first-child { border-radius: 12px 0 0 0; }
    .article-table th:last-child { border-radius: 0 12px 0 0; }
    .article-table td { padding: 11px 16px; border-bottom: 1px solid #f0f0f5; }
    .article-table tr:last-child td { border-bottom: none; }
    .article-table tr:nth-child(even) td { background: #f9f9fb; }
    .article-table .row-highlight td { background: #FDF3DC; font-weight: 700; color: #5a4a1a; }

    /* Price table (3 tiers) */
    .article-table .tier-min { color: #6e6e73; }
    .article-table .tier-rec { color: #1a7a3c; font-weight: 600; }
    .article-table .tier-prem { color: #8B5E00; font-weight: 600; }

    /* Error list */
    .article-error-list { list-style: none; display: flex; flex-direction: column; gap: 10px; margin: 16px 0; }
    .article-error-list li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: #fff5f6;
      border-left: 4px solid #ff3b5a;
      border-radius: 0 10px 10px 0;
      padding: 12px 16px;
      font-size: 15px;
      color: #3a3a3c;
      line-height: 1.5;
    }
    .article-error-list li::before { content: '✗'; color: #ff3b5a; font-weight: 800; flex-shrink: 0; }

    /* Tips list */
    .article-tips-list { list-style: none; display: flex; flex-direction: column; gap: 10px; margin: 16px 0; }
    .article-tips-list li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: #f0faf4;
      border-left: 4px solid #30d158;
      border-radius: 0 10px 10px 0;
      padding: 12px 16px;
      font-size: 15px;
      color: #3a3a3c;
      line-height: 1.5;
    }
    .article-tips-list li::before { content: '✓'; color: #30d158; font-weight: 800; flex-shrink: 0; }

    /* Rule list */
    .article-rule-list { list-style: none; display: flex; flex-direction: column; gap: 12px; margin: 16px 0; }
    .article-rule-list li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: #f5f0ff;
      border-left: 4px solid #7C3AED;
      border-radius: 0 10px 10px 0;
      padding: 14px 16px;
      font-size: 15px;
      color: #3a3a3c;
      line-height: 1.5;
    }
    .article-rule-list li .rule-label {
      font-weight: 700;
      color: #5b21b6;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .article-rule-list li::before { content: '◆'; color: #7C3AED; font-size: 11px; flex-shrink: 0; margin-top: 3px; }

    /* Article image */
    .article-img-wrap {
      margin: 28px 0;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .article-img-wrap img {
      width: 100%;
      display: block;
      object-fit: cover;
      max-height: 380px;
    }
    .article-img-caption {
      background: #f5f5f7;
      padding: 10px 16px;
      font-size: 13px;
      color: #6e6e73;
      font-style: italic;
      text-align: center;
    }

    /* Closing */
    .article-closing {
      text-align: center;
      padding: 40px 24px;
      border-top: 1px solid #e5e5ea;
      margin-top: 40px;
      font-size: 17px;
      font-style: italic;
      color: #6e6e73;
    }
    .article-closing strong { color: #C9A84C; font-style: normal; font-size: 20px; display: block; margin-top: 8px; }

    /* ── Modo pantalla completa (CSS) ── */
    .modal-bg.fs-mode {
      padding: 8px 8px 8px;
    }
    .modal-bg.fs-mode .modal-player {
      max-width: 100%;
      aspect-ratio: unset;
      flex: 1;
      height: 0;
      min-height: 0;
      border-radius: 8px;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .page-title { font-size: 28px; }
      .category-grid { grid-template-columns: repeat(2, 1fr); }
      .video-grid { grid-template-columns: 1fr; }
      .modal-bg {
        padding: 8px;
        justify-content: center;
        background: rgba(0,0,0,0.95);
      }
      .modal-toolbar { margin-bottom: 8px; }
      .modal-player {
        border-radius: 8px;
        width: 100%;
        max-width: 100%;
      }
      .search-wrap { max-width: none; }
      .breadcrumb { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <img src="logo.png" alt="El lucrativo negocio de las manualidades" id="logo" height="76">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="search" id="search-input" placeholder="Buscar videos…" autocomplete="off">
    </div>
    <button class="nav-learn" id="nav-learn-btn">📖 Aprende</button>
    <div class="breadcrumb" id="breadcrumb"></div>
  </div>
</header>

<main id="main"></main>

<div class="modal-bg" id="modal">
  <div class="modal-toolbar">
    <span class="modal-title" id="modal-title"></span>
    <button class="modal-close" id="modal-close-btn">✕ Cerrar</button>
  </div>
  <div class="modal-player" id="yt-modal">
    <div id="yt-frame"></div>
    <div class="yt-click-blocker"></div>
    <div class="yt-controls">
      <button class="yt-play-btn" id="yt-play-btn" title="Play / Pause">
        <svg id="yt-play-icon" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
        <svg id="yt-pause-icon" viewBox="0 0 24 24" fill="white" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <div class="yt-progress-wrap" id="yt-progress-wrap">
        <div class="yt-progress-fill" id="yt-progress-fill"></div>
      </div>
      <span class="yt-time" id="yt-time">0:00 / 0:00</span>
      <button class="yt-fs-btn" id="yt-fs-btn" title="Pantalla completa">
        <svg id="yt-fs-icon" viewBox="0 0 24 24" fill="white"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        <svg id="yt-fs-exit-icon" viewBox="0 0 24 24" fill="white" style="display:none"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
const ICONS = {
  'Mis Favoritos':           '❤️',
  'Pulseras':                '✨',
  'Macramé':                 '🧶',
  'Collares':                '📿',
  'Manualidades':            '🎨',
  'Llaveros y Phone Charms': '🔑',
  'Atrapasueños':            '🌙',
  'Porcelana fría':          '🌺',
  'Unboxings':               '📦',
  'Navidad':                 '🎄',
  'Aretes':                  '💎',
  'Anillos':                 '💍',
  'Religiosos':              '🕊️',
  'Tobilleras':              '🌸',
  'De todo':                 '🎁',
};

let catalogData = null;
let videoIndex  = []; // {id, title, category, catIdx}

// ── Storage ──────────────────────────────────────────────────────────────────

function getProgress(id) {
  try { return JSON.parse(localStorage.getItem('cm_p_' + id)) || null; } catch { return null; }
}
function saveProgress(id, cur, dur) {
  if (dur > 0) localStorage.setItem('cm_p_' + id, JSON.stringify({ cur, dur }));
}
function getFavs() {
  try { return new Set(JSON.parse(localStorage.getItem('cm_favs')) || []); } catch { return new Set(); }
}
function toggleFav(id) {
  const f = getFavs();
  f.has(id) ? f.delete(id) : f.add(id);
  localStorage.setItem('cm_favs', JSON.stringify([...f]));
  return f.has(id);
}

// ── Helpers ───────────────────────────────────────────────────────────────────

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmtTime(s) {
  s = Math.floor(s || 0);
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}
function setMain(html) { document.getElementById('main').innerHTML = html; }

function setBreadcrumb(label) {
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = label
    ? `<button id="bc-home">Inicio</button><span>›</span><span>${esc(label)}</span>`
    : '';
  if (label) document.getElementById('bc-home').addEventListener('click', () => {
    document.getElementById('search-input').value = '';
    showCategories();
  });
}

// ── Card builder ──────────────────────────────────────────────────────────────

function makeVideoCard(v, { showBadge = false } = {}) {
  const card = document.createElement('div');
  card.className    = 'vid-card';
  card.dataset.id   = v.id;
  card.dataset.name = v.title;

  const prog   = getProgress(v.id);
  const pct    = prog?.dur > 0 ? Math.min((prog.cur / prog.dur) * 100, 100) : 0;
  const resume = prog?.cur > 15 ? `<p class="vid-resume">Continuar en ${fmtTime(prog.cur)}</p>` : '';
  const bar    = pct > 1 ? `<div class="vid-watched-bar" style="width:${pct.toFixed(1)}%"></div>` : '';
  const badge  = showBadge && v.category ? `<span class="vid-cat-badge">${esc(v.category)}</span>` : '';
  const isFav  = getFavs().has(v.id);

  card.innerHTML = `
    <div class="vid-thumb">
      <img src="https://img.youtube.com/vi/${esc(v.id)}/mqdefault.jpg" alt="" loading="lazy">
      <div class="play-overlay">
        <div class="play-circle">
          <svg viewBox="0 0 24 24" fill="#1d1d1f"><path d="M8 5v14l11-7z"/></svg>
        </div>
      </div>
      ${bar}
    </div>
    <button class="fav-btn${isFav ? ' active' : ''}" data-fav="${esc(v.id)}" title="${isFav ? 'Quitar de favoritos' : 'Agregar a favoritos'}">${isFav ? '❤️' : '🤍'}</button>
    <div class="vid-info">
      <p class="vid-name">${esc(v.title)}</p>
      ${resume}
      ${badge}
    </div>
  `;
  return card;
}

// ── Views ─────────────────────────────────────────────────────────────────────

async function showCategories() {
  setBreadcrumb(null);
  document.title = 'El lucrativo negocio de las manualidades';
  document.getElementById('nav-learn-btn')?.classList.remove('active');

  if (!catalogData) {
    setMain('<div class="state-block"><div class="spinner"></div><span>Cargando…</span></div>');
    try {
      const res = await fetch('videos.json');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      catalogData = await res.json();
      videoIndex  = [];
      catalogData.forEach((cat, catIdx) =>
        cat.videos.forEach(v => videoIndex.push({ ...v, category: cat.category, catIdx }))
      );
    } catch (e) {
      setMain(`<div class="state-block">⚠️ Error al cargar el catálogo.<br><small>${esc(e.message)}</small></div>`);
      return;
    }
  }

  const grid = document.createElement('div');
  grid.className = 'category-grid';

  // Mis Favoritos (si hay)
  const favIds = getFavs();
  if (favIds.size > 0) {
    const fc = document.createElement('div');
    fc.className = 'cat-card fav-cat';
    fc.dataset.special = 'favorites';
    fc.innerHTML = `
      <span class="cat-icon">❤️</span>
      <span class="cat-name">Mis Favoritos</span>
      <span class="cat-count">${favIds.size} video${favIds.size !== 1 ? 's' : ''}</span>
    `;
    grid.appendChild(fc);
  }

  catalogData.forEach((cat, idx) => {
    const card = document.createElement('div');
    card.className      = 'cat-card';
    card.dataset.catIdx = idx;
    card.innerHTML = `
      <span class="cat-icon">${ICONS[cat.category] ?? '📁'}</span>
      <span class="cat-name">${esc(cat.category)}</span>
      <span class="cat-count">${cat.videos.length} videos</span>
    `;
    grid.appendChild(card);
  });

  grid.addEventListener('click', e => {
    const card = e.target.closest('.cat-card');
    if (!card) return;
    if (card.dataset.special === 'favorites') { showFavorites(); return; }
    showVideos(Number(card.dataset.catIdx));
  });

  const container = document.getElementById('main');
  container.innerHTML = `<h1 class="page-title">El lucrativo negocio de las manualidades</h1><p class="page-subtitle">Selecciona una categoría</p>`;
  container.appendChild(grid);
}

function renderVideoGrid(videos, { title, subtitle, backFn, showBadge = false }) {
  const container = document.getElementById('main');
  container.innerHTML = '';

  if (backFn) {
    const btn = document.createElement('button');
    btn.className   = 'back-btn';
    btn.textContent = '← Categorías';
    btn.addEventListener('click', backFn);
    container.appendChild(btn);
  }

  container.insertAdjacentHTML('beforeend', `
    <h1 class="page-title">${esc(title)}</h1>
    <p class="page-subtitle">${esc(subtitle)}</p>
  `);

  if (!videos.length) {
    container.insertAdjacentHTML('beforeend', '<div class="state-block">No hay videos aquí todavía.</div>');
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'video-grid';
  videos.forEach(v => grid.appendChild(makeVideoCard(v, { showBadge })));

  // Play on card click
  grid.addEventListener('click', e => {
    if (e.target.closest('.fav-btn')) return; // handled separately
    const card = e.target.closest('.vid-card');
    if (card) openYouTube(card.dataset.id, card.dataset.name);
  });

  // Fav toggle
  grid.addEventListener('click', e => {
    const btn = e.target.closest('.fav-btn');
    if (!btn) return;
    e.stopPropagation();
    const id    = btn.dataset.fav;
    const isNow = toggleFav(id);
    btn.classList.toggle('active', isNow);
    btn.textContent = isNow ? '❤️' : '🤍';
    btn.title       = isNow ? 'Quitar de favoritos' : 'Agregar a favoritos';
  });

  container.appendChild(grid);
}

function showVideos(catIdx) {
  const cat = catalogData[catIdx];
  setBreadcrumb(cat.category);
  document.title = `${cat.category} – El lucrativo negocio de las manualidades`;
  renderVideoGrid(cat.videos, {
    title:    cat.category,
    subtitle: `${cat.videos.length} videos`,
    backFn:   showCategories,
  });
}

function showFavorites() {
  setBreadcrumb('Mis Favoritos');
  document.title = 'Mis Favoritos – El lucrativo negocio de las manualidades';
  const favIds = getFavs();
  const videos = videoIndex.filter(v => favIds.has(v.id));
  renderVideoGrid(videos, {
    title:     'Mis Favoritos',
    subtitle:  `${videos.length} video${videos.length !== 1 ? 's' : ''}`,
    backFn:    showCategories,
    showBadge: true,
  });
}

function showSearch(query) {
  query = query.trim();
  if (!query) { showCategories(); return; }
  setBreadcrumb(`"${query}"`);
  document.title = `${query} – El lucrativo negocio de las manualidades`;
  const q       = query.toLowerCase();
  const results = videoIndex.filter(v => v.title.toLowerCase().includes(q));
  renderVideoGrid(results, {
    title:     `Resultados: "${query}"`,
    subtitle:  results.length ? `${results.length} videos encontrados` : 'Sin resultados',
    showBadge: true,
  });
}

// ── YouTube modal ─────────────────────────────────────────────────────────────

let ytPlayer     = null;
let ytPollTimer  = null;
let ytFlashTimer = null;
let ytSaveTimer  = 0;
let ytCurrentId  = null;

function ytFlash() {
  const b = document.querySelector('.yt-click-blocker');
  if (!b) return;
  b.style.background = '#000';
  if (ytFlashTimer) clearTimeout(ytFlashTimer);
  ytFlashTimer = setTimeout(() => { b.style.background = 'transparent'; }, 700);
}

const ytApiReady = new Promise(resolve => {
  window.onYouTubeIframeAPIReady = resolve;
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
});

function setYTPlayIcon(playing) {
  document.getElementById('yt-play-icon').style.display  = playing ? 'none'  : 'block';
  document.getElementById('yt-pause-icon').style.display = playing ? 'block' : 'none';
}

function updateYTProgress() {
  if (!ytPlayer?.getCurrentTime) return;
  try {
    const cur = ytPlayer.getCurrentTime();
    const dur = ytPlayer.getDuration();
    document.getElementById('yt-progress-fill').style.width = dur ? `${(cur/dur)*100}%` : '0%';
    document.getElementById('yt-time').textContent = `${fmtTime(cur)} / ${fmtTime(dur)}`;
    // Save every ~3s
    ytSaveTimer++;
    if (ytSaveTimer % 6 === 0 && ytCurrentId) saveProgress(ytCurrentId, cur, dur);
  } catch {}
}

async function openYouTube(videoId, name) {
  await ytApiReady;

  ytCurrentId = videoId;
  document.getElementById('modal-title').textContent = name;
  document.getElementById('modal').classList.add('open');
  document.getElementById('yt-progress-fill').style.width = '0%';
  document.getElementById('yt-time').textContent = '0:00 / 0:00';
  setYTPlayIcon(false);
  ytSaveTimer = 0;

  if (ytPollTimer) { clearInterval(ytPollTimer); ytPollTimer = null; }
  if (ytPlayer)    { try { ytPlayer.destroy(); } catch {} ytPlayer = null; }

  const frame = document.getElementById('yt-frame');
  frame.innerHTML = '<div id="yt-inner" style="width:100%;height:100%"></div>';

  const saved = getProgress(videoId);

  ytPlayer = new YT.Player('yt-inner', {
    videoId,
    width: '100%',
    height: '100%',
    playerVars: {
      autoplay: 1, controls: 0, rel: 0,
      modestbranding: 1, iv_load_policy: 3,
      disablekb: 0, fs: 1, playsinline: 1,
      origin: location.origin,
      start: saved?.cur > 15 ? Math.floor(saved.cur) : 0,
    },
    events: {
      onReady(e) {
        e.target.playVideo();
        ytPollTimer = setInterval(updateYTProgress, 500);
      },
      onStateChange(e) {
        setYTPlayIcon(e.data === YT.PlayerState.PLAYING);
        if (e.data === YT.PlayerState.ENDED) setYTPlayIcon(false);
      }
    }
  });
}

document.getElementById('yt-play-btn').addEventListener('click', () => {
  if (!ytPlayer) return;
  ytFlash();
  ytPlayer.getPlayerState() === YT.PlayerState.PLAYING
    ? ytPlayer.pauseVideo()
    : ytPlayer.playVideo();
});

document.getElementById('yt-progress-wrap').addEventListener('click', e => {
  if (!ytPlayer?.getDuration) return;
  ytFlash();
  const rect = e.currentTarget.getBoundingClientRect();
  ytPlayer.seekTo(((e.clientX - rect.left) / rect.width) * ytPlayer.getDuration(), true);
});

// Pantalla completa — expande el modal completo (toolbar + player)
const fsBtn      = document.getElementById('yt-fs-btn');
const fsIcon     = document.getElementById('yt-fs-icon');
const fsExitIcon = document.getElementById('yt-fs-exit-icon');
const modalBg    = document.getElementById('modal');
let   cssFs      = false;

function setFsIcon(on) {
  fsIcon.style.display     = on ? 'none'  : 'block';
  fsExitIcon.style.display = on ? 'block' : 'none';
}

function enterFs() {
  cssFs = true;
  modalBg.classList.add('fs-mode');
  setFsIcon(true);
  // Sugerir rotar el teléfono si está en portrait
  if (screen.orientation?.lock) screen.orientation.lock('landscape').catch(() => {});
}

function exitFs() {
  cssFs = false;
  modalBg.classList.remove('fs-mode');
  setFsIcon(false);
  if (screen.orientation?.unlock) screen.orientation.unlock();
}

fsBtn.addEventListener('click', () => cssFs ? exitFs() : enterFs());

// ── Cerrar modal ──────────────────────────────────────────────────────────────

function closeModal() {
  if (ytPlayer && ytCurrentId) {
    try { saveProgress(ytCurrentId, ytPlayer.getCurrentTime(), ytPlayer.getDuration()); } catch {}
  }
  if (cssFs) exitFs();
  document.getElementById('modal').classList.remove('open');
  if (ytPollTimer) { clearInterval(ytPollTimer); ytPollTimer = null; }
  if (ytPlayer)    { try { ytPlayer.stopVideo(); } catch {} }
}

document.getElementById('modal-close-btn').addEventListener('click', closeModal);
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── Search ────────────────────────────────────────────────────────────────────

let searchTimer = null;
document.getElementById('search-input').addEventListener('input', e => {
  clearTimeout(searchTimer);
  const q = e.target.value;
  searchTimer = setTimeout(() => {
    if (!catalogData) return;
    q.trim() ? showSearch(q) : showCategories();
  }, 220);
});

// ── Sección Aprende ──────────────────────────────────────────────────────────

let articlesData = null;

async function showLearn() {
  setBreadcrumb(null);
  document.title = 'Aprende – El lucrativo negocio de las manualidades';
  document.getElementById('search-input').value = '';
  document.getElementById('nav-learn-btn').classList.add('active');

  if (!articlesData) {
    setMain('<div class="state-block"><div class="spinner"></div><span>Cargando guías…</span></div>');
    try {
      const res = await fetch('articles.json');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      articlesData = await res.json();
    } catch (e) {
      setMain(`<div class="state-block">⚠️ Error al cargar guías.<br><small>${esc(e.message)}</small></div>`);
      return;
    }
  }

  const grid = document.createElement('div');
  grid.className = 'learn-grid';

  articlesData.forEach((art, idx) => {
    const card = document.createElement('div');
    card.className = 'learn-card';
    card.dataset.artIdx = idx;
    card.style.cssText = `background:${art.bg};`;
    card.innerHTML = `
      <span class="learn-card-emoji">${art.emoji}</span>
      <span class="learn-card-tag" style="color:${art.color}">${esc(art.category)}</span>
      <h2 class="learn-card-title">${esc(art.title)}</h2>
      <p class="learn-card-desc">${esc(art.subtitle)}</p>
      <span class="learn-card-meta">📖 ${esc(art.readTime)} de lectura</span>
    `;
    grid.appendChild(card);
  });

  grid.addEventListener('click', e => {
    const card = e.target.closest('.learn-card');
    if (card) showArticle(Number(card.dataset.artIdx));
  });

  const container = document.getElementById('main');
  container.innerHTML = `<h1 class="page-title">Aprende</h1><p class="page-subtitle">Guías para hacer crecer tu negocio</p>`;
  container.appendChild(grid);
}

function showArticle(idx) {
  const art = articlesData[idx];
  document.title = `${art.title} – El lucrativo negocio de las manualidades`;
  setBreadcrumb(art.title);

  const container = document.getElementById('main');
  container.innerHTML = '';

  const backBtn = document.createElement('button');
  backBtn.className = 'back-btn';
  backBtn.textContent = '← Guías';
  backBtn.addEventListener('click', showLearn);
  container.appendChild(backBtn);

  const body = document.createElement('div');
  body.className = 'article-body';

  // Hero
  body.insertAdjacentHTML('beforeend', `
    <div class="article-hero" style="background:${art.bg}">
      <div class="article-hero-tag" style="color:${art.color}">${esc(art.category)}</div>
      <h1 class="article-hero-title">${esc(art.title)}</h1>
      <p class="article-hero-sub">${esc(art.subtitle)}</p>
      <p class="article-hero-meta">${art.emoji} ${esc(art.readTime)} de lectura</p>
    </div>
  `);

  // Sections
  art.sections.forEach(sec => {
    body.insertAdjacentHTML('beforeend', renderSection(sec, art));
  });

  container.appendChild(body);
}

function renderSection(sec, art) {
  switch (sec.type) {
    case 'intro':
      return `<p class="article-intro">${esc(sec.text)}</p>`;

    case 'image':
      return `
        <div class="article-img-wrap">
          <img src="${esc(sec.url)}" alt="${esc(sec.alt)}" loading="lazy">
          ${sec.caption ? `<div class="article-img-caption">${esc(sec.caption)}</div>` : ''}
        </div>
      `;

    case 'heading':
      return `
        <div class="article-section">
        <div class="article-section-heading">
          <span class="article-section-num" style="background:${art.color}">${sec.number}</span>
          <h2 class="article-section-title">${esc(sec.title)}</h2>
        </div>
      `;

    case 'text':
      return `<p class="article-text">${esc(sec.text)}</p>`;

    case 'formula':
      return `
        <div class="article-formula">
          <div class="article-formula-label">${esc(sec.label)}</div>
          <div class="article-formula-text">${esc(sec.formula)}</div>
          ${sec.note ? `<div class="article-formula-note">${esc(sec.note)}</div>` : ''}
        </div>
      `;

    case 'tip':
      return `<div class="article-tip">${esc(sec.text)}</div>`;

    case 'steps':
      return `<ol class="article-steps">${sec.items.map((item, i) =>
        `<li><span class="step-num">${i+1}</span><span>${esc(item)}</span></li>`
      ).join('')}</ol>`;

    case 'table':
    case 'price-table': {
      const isPriceTable = sec.type === 'price-table';
      const rows = sec.rows.map((row, ri) => {
        const isHighlight = sec.highlight?.includes(ri);
        const cells = row.map((cell, ci) => {
          let cls = '';
          if (isPriceTable) {
            if (ci === 1) cls = 'tier-min';
            if (ci === 2) cls = 'tier-rec';
            if (ci === 3) cls = 'tier-prem';
          }
          return `<td class="${cls}">${esc(cell)}</td>`;
        }).join('');
        return `<tr class="${isHighlight ? 'row-highlight' : ''}">${cells}</tr>`;
      }).join('');
      const headers = sec.headers.map(h => `<th>${esc(h)}</th>`).join('');
      return `<div class="article-table-wrap"><table class="article-table"><thead><tr>${headers}</tr></thead><tbody>${rows}</tbody></table></div>`;
    }

    case 'error-list':
      return `<ul class="article-error-list">${sec.items.map(item =>
        `<li>${esc(item)}</li>`
      ).join('')}</ul>`;

    case 'tips-list':
      return `<ul class="article-tips-list">${sec.items.map(item =>
        `<li>${esc(item)}</li>`
      ).join('')}</ul>`;

    case 'rule-list':
      return `<ul class="article-rule-list">${sec.items.map(item =>
        `<li><span class="rule-label">${esc(item.label)}</span><span>${esc(item.text)}</span></li>`
      ).join('')}</ul>`;

    case 'closing':
      return `</div><div class="article-closing">${esc(sec.text)}<strong>¡Tu talento vale! 💛</strong></div>`;

    default: return '';
  }
}

// ── Boot ──────────────────────────────────────────────────────────────────────

document.getElementById('logo').addEventListener('click', () => {
  document.getElementById('search-input').value = '';
  document.getElementById('nav-learn-btn').classList.remove('active');
  showCategories();
});

document.getElementById('nav-learn-btn').addEventListener('click', showLearn);

showCategories();
</script>
</body>
</html>
