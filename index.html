<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cursomania – Videos de cursos de bisutería organizados por categoría.">
  <title>Cursomania – Bisutería</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231A6FD4'/><text y='72' x='50' text-anchor='middle' font-size='58' font-family='Arial' font-weight='900' fill='%23F5A623'>C</text></svg>">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
      cursor: pointer;
    }
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: #6e6e73;
    }
    .breadcrumb button {
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      color: #0066cc;
      padding: 0;
    }
    .breadcrumb button:hover { text-decoration: underline; }

    /* ── Main ── */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }
    .page-title {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.8px;
      line-height: 1.1;
    }
    .page-subtitle {
      margin-top: 8px;
      margin-bottom: 40px;
      font-size: 17px;
      color: #6e6e73;
    }

    /* ── Category grid ── */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }
    .cat-card {
      background: #fff;
      border-radius: 18px;
      padding: 28px 22px;
      cursor: pointer;
      border: 1px solid rgba(0,0,0,0.05);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      display: flex;
      flex-direction: column;
      gap: 12px;
      user-select: none;
    }
    .cat-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(0,0,0,0.12);
    }
    .cat-card:active { transform: scale(0.97); }
    .cat-icon { font-size: 38px; line-height: 1; }
    .cat-name { font-size: 16px; font-weight: 600; letter-spacing: -0.2px; }
    .cat-arrow { font-size: 13px; color: #6e6e73; }

    /* ── Back button ── */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
      color: #0066cc;
      padding: 0;
      margin-bottom: 28px;
    }
    .back-btn:hover { text-decoration: underline; }

    /* ── Video grid ── */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 20px;
    }
    .vid-card {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid rgba(0,0,0,0.05);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      user-select: none;
    }
    .vid-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(0,0,0,0.12);
    }
    .vid-thumb {
      width: 100%;
      aspect-ratio: 16/9;
      background: #e5e5ea;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }
    .vid-thumb img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.18s;
    }
    .vid-card:hover .play-overlay { opacity: 1; }
    .play-circle {
      width: 54px;
      height: 54px;
      background: rgba(255,255,255,0.95);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .play-circle svg { width: 22px; height: 22px; margin-left: 3px; }
    .vid-info { padding: 14px 16px; }
    .vid-name {
      font-size: 14px;
      font-weight: 500;
      color: #1d1d1f;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
    }

    /* ── Modal ── */
    .modal-bg {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 56px 24px 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .modal-bg.open {
      opacity: 1;
      pointer-events: all;
    }
    .modal-toolbar {
      width: 100%;
      max-width: 960px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      flex-shrink: 0;
    }
    .modal-title {
      font-size: 14px;
      color: rgba(255,255,255,0.75);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: calc(100% - 100px);
    }
    .modal-close {
      flex-shrink: 0;
      background: rgba(255,255,255,0.15);
      border: none;
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      padding: 6px 14px;
      border-radius: 20px;
      transition: background 0.15s;
    }
    .modal-close:hover { background: rgba(255,255,255,0.25); }
    .modal-player {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      transform: scale(0.96);
      transition: transform 0.25s ease;
      position: relative;
    }
    .modal-bg.open .modal-player { transform: scale(1); }

    /* ── YouTube custom controls ── */
    #yt-frame { width: 100%; height: 100%; }
    #yt-frame iframe { width: 100% !important; height: 100% !important; border: none; }

    /* Bloquea clics en elementos de YouTube sin interferir con nuestros controles */
    .yt-click-blocker {
      position: absolute;
      inset: 0;
      z-index: 5;
      background: transparent;
      transition: background 0.15s;
    }
    /* Barra negra superior: cubre el título de YouTube */
    .yt-click-blocker::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 64px;
      background: #000;
      border-radius: 14px 14px 0 0;
    }

    .yt-controls {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 52px;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      border-radius: 0 0 14px 14px;
      z-index: 10;
    }
    .yt-play-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      opacity: 0.9;
      transition: opacity 0.15s;
    }
    .yt-play-btn:hover { opacity: 1; }
    .yt-play-btn svg { width: 22px; height: 22px; }
    .yt-progress-wrap {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.3);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }
    .yt-progress-wrap:hover { height: 6px; }
    .yt-progress-fill {
      height: 100%;
      background: #fff;
      border-radius: 2px;
      width: 0%;
      pointer-events: none;
      transition: width 0.1s linear;
    }
    .yt-time {
      font-size: 12px;
      color: rgba(255,255,255,0.85);
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* ── Loading / states ── */
    .state-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 100px 0;
      gap: 16px;
      color: #6e6e73;
      font-size: 16px;
      text-align: center;
    }
    .spinner {
      width: 30px;
      height: 30px;
      border: 2px solid #d2d2d7;
      border-top-color: #1d1d1f;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .page-title { font-size: 28px; }
      .category-grid { grid-template-columns: repeat(2, 1fr); }
      .video-grid { grid-template-columns: 1fr; }
      .modal-bg { padding: 16px; justify-content: flex-end; }
      .modal-player { border-radius: 10px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <img src="logo.png" alt="CursoManía" id="logo" height="38" style="cursor:pointer;display:block;">
    <div class="breadcrumb" id="breadcrumb"></div>
  </div>
</header>

<main id="main"></main>

<!-- YouTube player con controles propios -->
<div class="modal-bg" id="modal">
  <div class="modal-toolbar">
    <span class="modal-title" id="modal-title"></span>
    <button class="modal-close" id="modal-close-btn">✕ Cerrar</button>
  </div>
  <div class="modal-player" id="yt-modal">
    <div id="yt-frame"></div>
    <div class="yt-click-blocker"></div>
    <div class="yt-controls">
      <button class="yt-play-btn" id="yt-play-btn" title="Play / Pause">
        <svg id="yt-play-icon" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
        <svg id="yt-pause-icon" viewBox="0 0 24 24" fill="white" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <div class="yt-progress-wrap" id="yt-progress-wrap">
        <div class="yt-progress-fill" id="yt-progress-fill"></div>
      </div>
      <span class="yt-time" id="yt-time">0:00 / 0:00</span>
    </div>
  </div>
</div>

<script>
const ICONS = {
  'Pulseras':              '✨',
  'Macramé':               '🧶',
  'Collares':              '📿',
  'Manualidades':          '🎨',
  'Llaveros y Phone Charms': '🔑',
  'Atrapasueños':          '🌙',
  'Porcelana fría':        '🌺',
  'Unboxings':             '📦',
  'Navidad':               '🎄',
  'Aretes':                '💎',
  'Anillos':               '💍',
  'Religiosos':            '🕊️',
  'Tobilleras':            '🌸',
  'De todo':               '🎁',
};

let catalogData = null; // [{category, videos:[{id,title}]}]

// ── Render helpers ───────────────────────────────────────────────────────────

function setMain(html) {
  document.getElementById('main').innerHTML = html;
}

function setBreadcrumb(categoryName) {
  document.getElementById('breadcrumb').innerHTML = categoryName
    ? `<button id="bc-home">Inicio</button><span>›</span><span>${esc(categoryName)}</span>`
    : '';
  if (categoryName) {
    document.getElementById('bc-home').addEventListener('click', showCategories);
  }
}

// ── Views ────────────────────────────────────────────────────────────────────

async function showCategories() {
  setBreadcrumb(null);
  document.title = 'Cursomania – Bisutería';

  if (!catalogData) {
    setMain('<div class="state-block"><div class="spinner"></div><span>Cargando…</span></div>');
    try {
      const res = await fetch('videos.json');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      catalogData = await res.json();
    } catch (e) {
      setMain(`<div class="state-block">⚠️ Error al cargar el catálogo.<br><small>${esc(e.message)}</small></div>`);
      return;
    }
  }

  const grid = document.createElement('div');
  grid.className = 'category-grid';

  catalogData.forEach((cat, idx) => {
    const count = cat.videos.length;
    const card  = document.createElement('div');
    card.className      = 'cat-card';
    card.dataset.catIdx = idx;
    card.innerHTML = `
      <span class="cat-icon">${ICONS[cat.category] ?? '📁'}</span>
      <span class="cat-name">${esc(cat.category)}</span>
      <span class="cat-arrow">${count} video${count !== 1 ? 's' : ''}</span>
    `;
    grid.appendChild(card);
  });

  grid.addEventListener('click', e => {
    const card = e.target.closest('.cat-card');
    if (card) showVideos(Number(card.dataset.catIdx));
  });

  const container = document.getElementById('main');
  container.innerHTML = `
    <h1 class="page-title">Cursomania</h1>
    <p class="page-subtitle">Selecciona una categoría</p>
  `;
  container.appendChild(grid);
}

function showVideos(catIdx) {
  const cat     = catalogData[catIdx];
  const videos  = cat.videos;
  const catName = cat.category;

  setBreadcrumb(catName);
  document.title = `${catName} – Cursomania`;

  const container = document.getElementById('main');
  const backBtn   = document.createElement('button');
  backBtn.className = 'back-btn';
  backBtn.textContent = '← Categorías';
  backBtn.addEventListener('click', showCategories);

  container.innerHTML = '';
  container.appendChild(backBtn);
  container.insertAdjacentHTML('beforeend', `
    <h1 class="page-title">${esc(catName)}</h1>
    <p class="page-subtitle">${videos.length} ${videos.length === 1 ? 'video' : 'videos'}</p>
  `);

  const grid = document.createElement('div');
  grid.className = 'video-grid';

  videos.forEach(v => {
    const card = document.createElement('div');
    card.className    = 'vid-card';
    card.dataset.id   = v.id;
    card.dataset.name = v.title;
    card.innerHTML = `
      <div class="vid-thumb">
        <img src="https://img.youtube.com/vi/${esc(v.id)}/mqdefault.jpg" alt="" loading="lazy">
        <div class="play-overlay">
          <div class="play-circle">
            <svg viewBox="0 0 24 24" fill="#1d1d1f"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>
      </div>
      <div class="vid-info">
        <p class="vid-name">${esc(v.title)}</p>
      </div>
    `;
    grid.appendChild(card);
  });

  grid.addEventListener('click', e => {
    const card = e.target.closest('.vid-card');
    if (card) openYouTube(card.dataset.id, card.dataset.name);
  });

  container.appendChild(grid);
}

// ── YouTube modal ─────────────────────────────────────────────────────────────

let ytPlayer    = null;
let ytPollTimer = null;
let ytFlashTimer = null;

function ytFlash() {
  const b = document.querySelector('.yt-click-blocker');
  if (!b) return;
  b.style.background = '#000';
  if (ytFlashTimer) clearTimeout(ytFlashTimer);
  ytFlashTimer = setTimeout(() => { b.style.background = 'transparent'; }, 700);
}

const ytApiReady = new Promise(resolve => {
  window.onYouTubeIframeAPIReady = resolve;
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
});

function fmtTime(s) {
  s = Math.floor(s || 0);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '00')}`;
}

function setYTPlayIcon(playing) {
  document.getElementById('yt-play-icon').style.display  = playing ? 'none'  : 'block';
  document.getElementById('yt-pause-icon').style.display = playing ? 'block' : 'none';
}

function updateYTProgress() {
  if (!ytPlayer?.getCurrentTime) return;
  try {
    const cur = ytPlayer.getCurrentTime();
    const dur = ytPlayer.getDuration();
    document.getElementById('yt-progress-fill').style.width =
      dur ? `${(cur / dur) * 100}%` : '0%';
    document.getElementById('yt-time').textContent =
      `${fmtTime(cur)} / ${fmtTime(dur)}`;
  } catch {}
}

async function openYouTube(videoId, name) {
  await ytApiReady;

  document.getElementById('modal-title').textContent = name;
  document.getElementById('modal').classList.add('open');

  document.getElementById('yt-progress-fill').style.width = '0%';
  document.getElementById('yt-time').textContent = '0:00 / 0:00';
  setYTPlayIcon(false);

  if (ytPollTimer) { clearInterval(ytPollTimer); ytPollTimer = null; }
  if (ytPlayer)    { try { ytPlayer.destroy(); } catch {} ytPlayer = null; }

  const frame = document.getElementById('yt-frame');
  frame.innerHTML = '<div id="yt-inner" style="width:100%;height:100%"></div>';

  ytPlayer = new YT.Player('yt-inner', {
    videoId,
    width: '100%',
    height: '100%',
    playerVars: {
      autoplay: 1, controls: 0, rel: 0,
      modestbranding: 1, iv_load_policy: 3,
      disablekb: 0, fs: 1, playsinline: 1,
      origin: location.origin
    },
    events: {
      onReady(e) {
        e.target.playVideo();
        ytPollTimer = setInterval(updateYTProgress, 500);
      },
      onStateChange(e) {
        setYTPlayIcon(e.data === YT.PlayerState.PLAYING);
        if (e.data === YT.PlayerState.ENDED) setYTPlayIcon(false);
      }
    }
  });
}

document.getElementById('yt-play-btn').addEventListener('click', () => {
  if (!ytPlayer) return;
  ytFlash();
  ytPlayer.getPlayerState() === YT.PlayerState.PLAYING
    ? ytPlayer.pauseVideo()
    : ytPlayer.playVideo();
});

document.getElementById('yt-progress-wrap').addEventListener('click', e => {
  if (!ytPlayer?.getDuration) return;
  ytFlash();
  const rect = e.currentTarget.getBoundingClientRect();
  ytPlayer.seekTo(((e.clientX - rect.left) / rect.width) * ytPlayer.getDuration(), true);
});

// ── Cerrar modal ─────────────────────────────────────────────────────────────

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  if (ytPollTimer) { clearInterval(ytPollTimer); ytPollTimer = null; }
  if (ytPlayer)    { try { ytPlayer.stopVideo(); } catch {} }
}

document.getElementById('modal-close-btn').addEventListener('click', closeModal);
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── Utils ─────────────────────────────────────────────────────────────────────

function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ── Boot ─────────────────────────────────────────────────────────────────────

document.getElementById('logo').addEventListener('click', showCategories);
showCategories();
</script>
</body>
</html>
